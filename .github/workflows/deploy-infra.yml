name: Deploy Infrastructure
on:
  push:
    branches: [master]
    paths:
      - 'infra/**' # Triggers only if files in the infra folder change
    
permissions:
      contents: read
      id-token: write

env:
  APP_NAME: infrared
  LOCATION: centralus

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    needs: build-push-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: az account show

      - name: Deploy Main (ResourceGroup) Bicep
        uses: azure/bicep-deploy@v2
        with:
          name: bicep-deploy-rg-centralus 
          type: deployment
          operation: create
          scope: subscription
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 
          location: ${{ env.LOCATION }}
          template-file: ./infra/main.bicep
          parameters: |
            appName: ${{ env.APP_NAME }}
            location: ${{ env.LOCATION }}

      - name: Deploy Resources Bicep
        uses: azure/bicep-deploy@v2
        with:
          name: bicep-deploy-centralus 
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 
          resource-group-name: rg-infrared
          template-file: ./infra/resources.bicep
          parameters-file: ./infra/resources.bicepparam
          parameters: |
            appName: ${{ env.APP_NAME }}
            location: ${{ env.LOCATION }}
            ghcrUsername: ${{ github.actor }}
            ghcrPassword: ${{ secrets.GHCR_TOKEN }}
            sqlAdminLogin: ${{ secrets.SQL_ADMIN_LOGIN }}
            sqlAdminPassword: ${{ secrets.SQL_ADMIN_PASSWORD }}
