name: Build & Deploy

on:
  push:
    branches: [master]
    
permissions:
  contents: read

env:
  APP_NAME: infrared
  GHCR_REGISTRY: ghcr.io

jobs:
  build-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/infrared-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set image tag output
        id: version
        run: echo "version=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install and Build Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Azure Login
        uses: azure/login@v3
        with:
          
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get SWA API key
        id: swa
        uses: azure/CLI@v3
        with:
          inlineScript: |
            APIKEY=$(az staticwebapp secrets list \
              --name "swa-${{ env.APP_NAME }}" \
              --resource-group "rg-${{ env.APP_NAME }}" \
              --query "properties.apiKey" -o tsv)
            echo "apikey=$APIKEY" >> $GITHUB_OUTPUT

      # - name: Build and deploy frontend
      #   uses: Azure/static-web-apps-deploy@v1
      #   with:
      #     azure_static_web_apps_api_token: ${{ steps.swa.outputs.apikey }}
      #     repo_token: ${{ secrets.GITHUB_TOKEN }}
      #     action: 'upload'
      #     app_location: '/apps/infrared-web'
      #     output_location: 'dist'
      #     app_build_command: 'npm run build'
      #     skip_api_build: true   

      - name: Build and deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.apikey }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/apps/infrared-web'
          output_location: 'dist'
          skip_app_build: true
          skip_api_build: true