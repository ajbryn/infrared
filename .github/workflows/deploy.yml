name: Build & Deploy

on:
  push:
    branches: [main]

env:
  APP_NAME: myapp
  LOCATION: southcentralus
  GHCR_REGISTRY: ghcr.io

jobs:
  build-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/infrared-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set image tag output
        id: version
        run: echo "version=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  deploy-infra:
    runs-on: ubuntu-latest
    needs: build-push-backend
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          template: ./infra/main.bicep
          parameters: |
            appName=${{ env.APP_NAME }}
            location=${{ env.LOCATION }}
            backendImage=${{ env.GHCR_REGISTRY }}/${{ github.repository }}/backend:${{ needs.build-push-backend.outputs.image-tag }}
            ghcrUsername=${{ github.actor }}
            ghcrPassword=${{ secrets.GHCR_TOKEN }}
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
            githubRepoUrl=https://github.com/${{ github.repository }}
            githubRepoToken=${{ secrets.GITHUB_TOKEN }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get SWA API key
        id: swa
        uses: azure/CLI@v2
        with:
          inlineScript: |
            APIKEY=$(az staticwebapp secrets list \
              --name "swa-${{ env.APP_NAME }}" \
              --resource-group "rg-${{ env.APP_NAME }}" \
              --query "properties.apiKey" -o tsv)
            echo "apikey=$APIKEY" >> $GITHUB_OUTPUT

      - name: Build and deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.apikey }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/apps/infrared-web'
          output_location: '/web/dist'
          app_build_command: 'npm run build'
          skip_api_build: true   